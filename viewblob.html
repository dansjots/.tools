<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        video {
            position: absolute;
            margin: auto;
            left: 0;
            bottom: 0;
            right: 0;
            top: 0;
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            overflow-clip-margin: content-box;
            overflow: clip;
        }
    </style>
</head>

<body>
    <h1>View Blob</h1>
    <form>
        <table>
            <tr>
                <td><label>PDS</label></td>
                <td><input name="pds" placeholder="bsky.social (optional)"></td>
            </tr>
            <tr>
                <td><label>DID</label></td>
                <td><input name="did" placeholder="did:plc:xyz123abc..."></td>
            </tr>
            <tr>
                <td><label>CID</label></td>
                <td><input name="cid" placeholder="bafkreixyz123abc345..."></td>
            </tr>
        </table>
        <input type="submit">
    </form>
    <script>
        {
            const main = async function (script) {
                const args = new URLSearchParams(document.location.search);
                if (args.has('did') && args.has('cid')) {
                    document.body.innerHTML = 'loading...';
                    const pds = args.get('pds') ? args.get('pds') : 'bsky.social';
                    const cid = args.get('cid');
                    const did = args.get('did');
                    const url = 'https://' + pds + '/xrpc/com.atproto.sync.getBlob?did=' + did + '&cid=' + cid;

                    let response = await fetch(url, { method: 'HEAD' });
                    let mime = response.headers.get('content-type');
                    if (mime.startsWith('video')) {
                        document.body.innerHTML = '<video controls src="' + url + '"></video><br><a href="' + url + '">' + url + '</a>';
                    } else if (mime.startsWith('image')) {
                        document.body.innerHTML = '<img src="' + url + '"></img><br><a href="' + url + '">' + url + '</a>';
                    } else {
                        document.location = url;
                    }
                } else {
                    script.remove();
                }
            }
            main(document.currentScript);
        }
    </script>
</body>
